<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drug Safety System · รพ.กรงปินัง</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#009E9E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="pc-root" data-theme="dark">
  <div id="pc-phone" data-theme="dark">

    <!-- status bar -->
    <div id="status-bar">
      <span id="sb-time">9:41</span>
      <span class="notch"></span>
      <span class="sb-right">
        <span id="sb-role"></span>
        <span class="battery"></span>
      </span>
    </div>

    <!-- screen container -->
    <div id="screen"></div>

    <!-- toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- sheet overlay -->
    <div id="sheet-overlay" class="overlay hidden">
      <div id="sheet-box"></div>
    </div>

    <!-- confirm overlay -->
    <div id="confirm-overlay" class="overlay hidden">
      <div id="confirm-box"></div>
    </div>

  </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
